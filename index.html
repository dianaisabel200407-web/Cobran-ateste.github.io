<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayFlow — Gestão de Cobranças</title>
<meta name="description" content="Protótipo autónomo de gestão de cobranças, pagamentos, clientes, prestações e reclamações.">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--soft:#f1f5f9;--primary:#172033;--primary2:#334155;--success:#087443;--successBg:#ecfdf3;--warning:#a15c00;--warningBg:#fff7e6;--danger:#b42318;--dangerBg:#fff0ef;--info:#175cd3;--infoBg:#eff8ff;--purple:#6941c6;--purpleBg:#f4f3ff;--shadow:0 10px 35px rgba(16,24,40,.07);--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.hidden{display:none!important}.container{width:min(1180px,calc(100% - 32px));margin:auto}
.header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{border:0;background:transparent;font-weight:900;font-size:22px;letter-spacing:-.045em;color:var(--text)}.brand span{color:#64748b}.navlinks{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.navlinks button{border:0;background:transparent;color:#475467;padding:9px 10px;border-radius:9px;font-weight:700}.navlinks button:hover,.navlinks button.active{background:var(--soft);color:var(--text)}
.btn{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:11px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.btn:hover{background:var(--primary2)}.btn.secondary{background:var(--soft);color:var(--text)}.btn.secondary:hover{background:#e2e8f0}.btn.success{background:#087443}.btn.danger{background:#d92d20}.btn.small{padding:8px 11px;font-size:12px}.btn.full{width:100%}
.page{padding:34px 0 70px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}.pagehead h1,.pagehead h2{margin:0;letter-spacing:-.035em}.pagehead p{margin:6px 0 0;color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.stack{display:grid;gap:12px}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#667085}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.notice{padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.45}.notice.info{background:var(--infoBg);color:#1849a9}.notice.success{background:var(--successBg);color:#067647}.notice.warn{background:var(--warningBg);color:#8a4b00}.notice.danger{background:var(--dangerBg);color:#b42318}.notice.purple{background:var(--purpleBg);color:#53389e}
.hero{padding:54px 0 30px}.hero-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:44px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.06em;margin:10px 0}.lead{max-width:760px;color:var(--muted);font-size:18px;line-height:1.6}.features{margin-top:18px}.feature h3{margin:8px 0 5px}.feature p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.feature-icon{font-size:26px}.demo-strip{margin-top:18px;background:#172033;color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.demo-strip code{background:rgba(255,255,255,.12);padding:3px 7px;border-radius:6px}
.auth-wrap{min-height:calc(100vh - 145px);display:grid;place-items:center;padding:40px 0}.auth{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.auth h1{font-size:31px;letter-spacing:-.04em;margin:7px 0}.auth-sub{color:var(--muted);font-size:14px}.role-tabs,.method-tabs{display:grid;gap:5px;background:var(--soft);padding:4px;border-radius:11px;margin:20px 0}.role-tabs{grid-template-columns:1fr 1fr}.method-tabs{grid-template-columns:repeat(3,1fr)}.tab{border:0;background:transparent;border-radius:8px;padding:10px;font-weight:800;color:var(--muted)}.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(16,24,40,.08)}.form{display:grid;gap:14px}.field{display:grid;gap:6px}.label{font-size:13px;font-weight:800;color:#344054}.input,.select,.textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:#fff;outline:none;color:var(--text)}.textarea{resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#667085;box-shadow:0 0 0 3px #eaecf0}.check{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:12px}.provider-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.provider{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:left}.provider.active{border-color:#172033;box-shadow:0 0 0 2px #e5e7eb}.provider strong{display:block}.provider span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.provider-icon{font-size:22px;margin-bottom:7px}.secure{font-size:11px;color:var(--muted);background:var(--soft);padding:10px 11px;border-radius:9px}.demo-logins{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.demo-login{border:1px dashed #cbd5e1;background:#fafafa;border-radius:12px;padding:13px;text-align:left}.demo-login:hover{background:#f8fafc}
.stats{margin-top:22px}.stat{display:flex;justify-content:space-between;gap:12px}.stat-label{font-size:12px;color:var(--muted);font-weight:800}.stat-value{font-size:30px;font-weight:900;letter-spacing:-.045em;margin-top:4px}.stat-icon{font-size:22px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{border:1px solid var(--line);border-radius:12px;padding:14px}.mini strong{font-size:20px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#172033;border-radius:99px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.table td{padding:13px 10px;border-bottom:1px solid #f2f4f7;font-size:13px}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge.pending{background:#fef0c7;color:#92400e}.badge.paid{background:#dcfae6;color:#067647}.badge.overdue{background:#fee4e2;color:#b42318}.badge.negotiation{background:#e0eaff;color:#175cd3}.badge.open{background:#fef0c7;color:#92400e}.badge.analysis{background:#e0eaff;color:#175cd3}.badge.resolved{background:#dcfae6;color:#067647}.rule{border-left:4px solid #172033;background:#f8fafc;padding:13px 14px;border-radius:0 10px 10px 0}.rule b{font-size:13px}.rule span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.charge-card{display:grid;gap:13px}.charge-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.amount{font-size:29px;font-weight:900;letter-spacing:-.045em}.subline{font-size:12px;color:var(--muted)}.split{display:flex;gap:8px}.split>*{flex:1}.list-item{border:1px solid #edf0f3;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #d0d5dd;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:100;display:grid;place-items:center;padding:18px}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.close{border:0;background:var(--soft);width:34px;height:34px;border-radius:9px}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#172033;color:#fff;border-radius:10px;padding:12px 15px;font-size:13px;box-shadow:var(--shadow)}.footer{padding:22px 0 45px;color:#98a2b3;font-size:11px}.divider{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:11px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.right{margin-left:auto}
@media(max-width:900px){.four{grid-template-columns:repeat(2,1fr)}.three,.two{grid-template-columns:1fr 1fr}.hero-card{padding:32px}.provider-grid{grid-template-columns:1fr}}
@media(max-width:620px){.container{width:min(100% - 20px,1180px)}.nav{align-items:flex-start;padding:12px 0;display:block}.navlinks{margin-top:9px}.four,.three,.two,.mini-grid,.demo-logins{grid-template-columns:1fr}.hero{padding-top:25px}.hero-card{padding:24px}.auth{padding:21px}.method-tabs{grid-template-columns:1fr 1fr 1fr}.page{padding-top:25px}.demo-strip{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="header">
  <div class="container nav">
    <button class="brand" onclick="go('home')">Pay<span>Flow</span></button>
    <nav id="nav" class="navlinks"></nav>
  </div>
</header>
<main id="app"></main>
<footer class="container footer">PayFlow — protótipo autónomo em HTML. Dados demo guardados apenas neste navegador.</footer>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const STORAGE='payflow-final-demo-v3';
const SESSION='payflow-session-v3';
const FX={EUR:1,USD:1.08,GBP:.84,BRL:5.90,AOA:950,MZN:68,CVE:110.27,CHF:.94};
const COUNTRY_CURRENCY={PT:'EUR',BR:'BRL',AO:'AOA',MZ:'MZN',CV:'CVE',GB:'GBP',US:'USD',CH:'CHF'};
const state={page:'home',userId:null,loginRole:'EMPRESA',registerRole:'EMPRESA',method:'PASSWORD',bank:'CGD',search:''};
function datePlus(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function seed(){return {users:[
 {id:'emp1',role:'EMPRESA',name:'Empresa Demo, Lda.',email:'empresa@demo.pt',password:'empresa123',auth:'CMD',identifier:'CMD DEMO'},
 {id:'cli1',role:'CLIENTE',name:'Cliente Demo',email:'cliente@demo.pt',password:'cliente123',auth:'NISS',identifier:'12345678901',country:'PT',companyId:'emp1'},
 {id:'cli2',role:'CLIENTE',name:'Cliente Internacional',email:'cliente.br@demo.pt',password:'cliente123',auth:'BANCO',identifier:'CGD DEMO',country:'BR',companyId:'emp1'}
],charges:[
 {id:'c1',description:'Serviço mensal — setembro',value:120,due:datePlus(6),status:'PENDENTE',companyId:'emp1',clientId:'cli1',discount:3,fine:0,created:datePlus(-2)},
 {id:'c2',description:'Fatura em atraso',value:80,due:datePlus(-2),status:'EM_ATRASO',companyId:'emp1',clientId:'cli1',discount:0,fine:5,created:datePlus(-12)},
 {id:'c3',description:'Consultoria internacional',value:250,due:datePlus(10),status:'PENDENTE',companyId:'emp1',clientId:'cli2',discount:3,fine:0,created:datePlus(-1)},
 {id:'c4',description:'Projeto concluído',value:420,due:datePlus(-18),status:'PAGO',companyId:'emp1',clientId:'cli1',discount:0,fine:0,created:datePlus(-35)}
],payments:[{id:'p1',chargeId:'c4',clientId:'cli1',value:420,currency:'EUR',method:'Cartão',date:new Date(Date.now()-12*86400000).toISOString()}],plans:[
 {id:'pl1',chargeId:'c2',clientId:'cli1',n:2,installments:[{id:'i1',n:1,value:40,due:datePlus(5),paid:false},{id:'i2',n:2,value:40,due:datePlus(35),paid:false}]}
],complaints:[{id:'r1',clientId:'cli1',companyId:'emp1',chargeId:'c2',message:'Não reconheço o valor adicional da multa.',status:'EM_ANALISE',response:'Estamos a verificar o cálculo da cobrança.',date:new Date(Date.now()-86400000).toISOString()}],notifications:[
 {id:'n1',clientId:'cli1',text:'A cobrança “Serviço mensal — setembro” vence em breve. Pode beneficiar de 3% de desconto se pagar antecipadamente.',read:false,date:new Date().toISOString()},
 {id:'n2',clientId:'cli1',text:'A sua reclamação #r1 está em análise.',read:false,date:new Date().toISOString()},
 {id:'n3',clientId:'cli2',text:'Tem uma cobrança internacional pendente. Consulte o valor convertido antes de pagar.',read:false,date:new Date().toISOString()}
]}}
let db=loadDB();
function loadDB(){try{const raw=localStorage.getItem(STORAGE);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.users&&parsed.charges)return parsed}}catch(e){}const d=seed();localStorage.setItem(STORAGE,JSON.stringify(d));return d}
function save(){localStorage.setItem(STORAGE,JSON.stringify(db))}
function resetDemo(){if(!confirm('Repor os dados demo? As alterações feitas neste navegador serão apagadas.'))return;db=seed();save();state.userId=null;localStorage.removeItem(SESSION);go('home');toast('Dados demo repostos.')}
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('pt-PT')}
function money(v,c='EUR'){try{return new Intl.NumberFormat('pt-PT',{style:'currency',currency:c}).format(Number(v)||0)}catch(e){return `${Number(v||0).toFixed(2)} ${c}`}}
function currencyForCountry(country){return COUNTRY_CURRENCY[country]||'EUR'}
function converted(v,country){const c=currencyForCountry(country);return Number(v)*FX[c]}
function currentUser(){return db.users.find(u=>u.id===state.userId)||null}
function setUser(id){state.userId=id;localStorage.setItem(SESSION,id);const u=currentUser();state.page=u?.role==='EMPRESA'?'dashboard':'client';render()}
function restore(){const id=localStorage.getItem(SESSION);if(id&&db.users.some(u=>u.id===id))state.userId=id}
restore();
function go(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function logout(){state.userId=null;localStorage.removeItem(SESSION);go('home');toast('Sessão terminada.')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.add('hidden'),2800)}
function badge(status){const map={PENDENTE:['pending','Pendente'],PAGO:['paid','Pago'],EM_ATRASO:['overdue','Em atraso'],NEGOCIACAO:['negotiation','Negociação']};const x=map[status]||['pending',status];return `<span class="badge ${x[0]}">${x[1]}</span>`}
function complaintBadge(status){const map={PENDENTE:['open','Pendente'],EM_ANALISE:['analysis','Em análise'],RESOLVIDA:['resolved','Resolvida']};const x=map[status]||map.PENDENTE;return `<span class="badge ${x[0]}">${x[1]}</span>`}
function renderNav(){const n=document.getElementById('nav'),u=currentUser();if(!u){n.innerHTML=`<button onclick="go('home')">Início</button><button onclick="go('login')">Entrar</button><button class="btn small" onclick="go('register')">Criar conta</button>`;return}if(u.role==='EMPRESA'){const open=db.complaints.filter(x=>x.companyId===u.id&&x.status!=='RESOLVIDA').length;n.innerHTML=`<button class="${state.page==='dashboard'?'active':''}" onclick="go('dashboard')">Dashboard</button><button class="${state.page==='charges'?'active':''}" onclick="go('charges')">Cobranças</button><button class="${state.page==='clients'?'active':''}" onclick="go('clients')">Clientes</button><button class="${state.page==='complaints'?'active':''}" onclick="go('complaints')">Reclamações ${open?`<span class="badge overdue">${open}</span>`:''}</button><button class="${state.page==='rules'?'active':''}" onclick="go('rules')">Regras</button><button onclick="go('profile')">${esc(u.name)}</button><button onclick="logout()">Sair</button>`}else{const unread=db.notifications.filter(x=>x.clientId===u.id&&!x.read).length;n.innerHTML=`<button class="${state.page==='client'?'active':''}" onclick="go('client')">A minha área ${unread?`<span class="badge overdue">${unread}</span>`:''}</button><button class="${state.page==='history'?'active':''}" onclick="go('history')">Histórico</button><button onclick="go('profile')">Perfil</button><button onclick="logout()">Sair</button>`}}
function render(){renderNav();const u=currentUser();let html;if(state.page==='home')html=home();else if(state.page==='login')html=auth('login');else if(state.page==='register')html=auth('register');else if(!u)html=auth('login');else if(state.page==='dashboard'&&u.role==='EMPRESA')html=dashboard();else if(state.page==='charges'&&u.role==='EMPRESA')html=charges();else if(state.page==='clients'&&u.role==='EMPRESA')html=clients();else if(state.page==='complaints'&&u.role==='EMPRESA')html=complaints();else if(state.page==='rules'&&u.role==='EMPRESA')html=rules();else if(state.page==='client'&&u.role==='CLIENTE')html=clientArea();else if(state.page==='history')html=historyPage();else if(state.page==='profile')html=profile();else html=u.role==='EMPRESA'?dashboard():clientArea();document.getElementById('app').innerHTML=html}
function home(){return `<section class="hero"><div class="container"><div class="hero-card"><div class="eyebrow">Gestão de cobranças</div><h1>Uma área única para cobrar, pagar e acompanhar.</h1><p class="lead">O PayFlow junta clientes, cobranças, notificações, pagamentos, prestações, moeda estrangeira e reclamações numa única aplicação.</p><div class="actions"><button class="btn" onclick="go('login')">Entrar na aplicação →</button><button class="btn secondary" onclick="go('register')">Criar conta</button></div><div class="demo-strip"><div><strong>Contas demo prontas:</strong> empresa e cliente da mesma empresa.</div><div class="actions"><button class="btn small secondary" onclick="demoLogin('EMPRESA')">Entrar como empresa</button><button class="btn small secondary" onclick="demoLogin('CLIENTE')">Entrar como cliente</button></div></div></div><div class="grid three features"><div class="card feature"><div class="feature-icon">🔔</div><h3>Notificações automáticas</h3><p>Avisos antes do vencimento, desconto de 3%, aviso no último dia e acompanhamento do atraso.</p></div><div class="card feature"><div class="feature-icon">💳</div><h3>Pagamento</h3><p>MB Way, cartão, transferência, referência e opção de pagamento com um clique.</p></div><div class="card feature"><div class="feature-icon">🤝</div><h3>Negociação</h3><p>Criação de planos de 2, 3 ou 6 prestações e acompanhamento do que falta pagar.</p></div><div class="card feature"><div class="feature-icon">🌍</div><h3>Moeda estrangeira</h3><p>Visualização do equivalente em USD, GBP, BRL, AOA, MZN, CVE ou CHF antes da confirmação.</p></div><div class="card feature"><div class="feature-icon">🧾</div><h3>Gestão empresarial</h3><p>Dashboard, clientes, cobranças, notificações, histórico e regras de cobrança.</p></div><div class="card feature"><div class="feature-icon">💬</div><h3>Reclamações e suporte</h3><p>O cliente pode reclamar e a empresa pode acompanhar, responder e resolver o pedido.</p></div></div></div></section>`}
function auth(mode){const login=mode==='login';return `<section class="auth-wrap"><div class="auth"><div class="eyebrow">PayFlow</div><h1>${login?'Iniciar sessão':'Criar conta'}</h1><p class="auth-sub">${login?'Escolha o perfil e entre com a conta demo ou com um método de identificação.':'Crie uma conta de empresa ou cliente para testar o fluxo completo.'}</p><div class="role-tabs"><button class="tab ${(login?state.loginRole:state.registerRole)==='EMPRESA'?'active':''}" onclick="selectRole('EMPRESA',${login})">🏢 Empresa</button><button class="tab ${(login?state.loginRole:state.registerRole)==='CLIENTE'?'active':''}" onclick="selectRole('CLIENTE',${login})">👤 Cliente</button></div>${login?loginForm():registerForm()}<div class="divider">contas demo</div><div class="demo-logins"><button class="demo-login" onclick="demoLogin('EMPRESA')"><strong>🏢 Empresa Demo</strong><div class="small muted">empresa@demo.pt · empresa123</div></button><button class="demo-login" onclick="demoLogin('CLIENTE')"><strong>👤 Cliente Demo</strong><div class="small muted">cliente@demo.pt · cliente123</div></button></div><div class="divider">${login?'ou criar conta':'já tem conta?'}</div><p class="small" style="text-align:center;margin:0">${login?'Ainda não tem conta?':'Já tem conta?'} <button style="border:0;background:none;text-decoration:underline;font-weight:800" onclick="go('${login?'register':'login'}')">${login?'Criar conta':'Entrar'}</button></p></div></section>`}
function selectRole(role,login){if(login)state.loginRole=role;else state.registerRole=role;render()}
function methodTabs(){return `<div class="method-tabs"><button class="tab ${state.method==='PASSWORD'?'active':''}" onclick="selectMethod('PASSWORD')">E-mail</button><button class="tab ${state.method==='CMD'?'active':''}" onclick="selectMethod('CMD')">CMD</button><button class="tab ${state.method==='BANK'?'active':''}" onclick="selectMethod('BANK')">Banco / NISS</button></div>`}
function selectMethod(m){state.method=m;render()}
function loginForm(){if(state.method==='PASSWORD')return `<div class="form"><div class="field"><label class="label">E-mail</label><input id="loginEmail" type="email" class="input" placeholder="nome@exemplo.pt"></div><div class="field"><label class="label">Palavra-passe</label><input id="loginPassword" type="password" class="input" placeholder="••••••••"></div><button class="btn full" onclick="passwordLogin()">Entrar</button></div>`;return methodTabs()+identityPanel('login')}
function identityPanel(context){if(state.method==='CMD')return `<div class="form"><div class="secure">🔐 <b>Chave Móvel Digital</b><br>Num produto real, este botão encaminha para o serviço oficial de autenticação. O PayFlow não deve recolher nem guardar o PIN da CMD.</div><button class="btn full" onclick="identityLogin('CMD','${context}')">Continuar com Chave Móvel Digital</button></div>`;return `<div class="form"><div class="provider-grid"><button class="provider ${state.bank==='CGD'?'active':''}" onclick="pickBank('CGD');return false"><div class="provider-icon">🏦</div><strong>CGD</strong><span>Caixa Geral de Depósitos</span></button><button class="provider ${state.bank==='BPI'?'active':''}" onclick="pickBank('BPI');return false"><div class="provider-icon">🏦</div><strong>BPI</strong><span>Banco BPI</span></button><button class="provider ${state.bank==='BCP'?'active':''}" onclick="pickBank('BCP');return false"><div class="provider-icon">🏦</div><strong>Millennium</strong><span>Millennium bcp</span></button></div><div class="field"><label class="label">NISS (opcional neste protótipo)</label><input id="authNiss" class="input" inputmode="numeric" placeholder="12345678901"></div><div class="secure">🔐 No produto real, o acesso bancário deve abrir o ambiente seguro do banco/provedor. O NISS é um identificador e não deve ser usado isoladamente como palavra-passe.</div><button class="btn full" onclick="identityLogin('BANK','${context}')">Continuar com banco</button><button class="btn secondary full" onclick="identityLogin('NISS','${context}')">Continuar com NISS / Segurança Social</button></div>`}
function registerForm(){return `<div class="form"><div class="field"><label class="label">${state.registerRole==='EMPRESA'?'Nome da empresa':'Nome completo'}</label><input id="regName" class="input" placeholder="${state.registerRole==='EMPRESA'?'Empresa Exemplo, Lda.':'Nome do cliente'}"></div><div class="field"><label class="label">E-mail</label><input id="regEmail" type="email" class="input" placeholder="nome@exemplo.pt"></div>${state.registerRole==='CLIENTE'?`<div class="field"><label class="label">País</label><select id="regCountry" class="select"><option value="PT">Portugal</option><option value="BR">Brasil</option><option value="AO">Angola</option><option value="MZ">Moçambique</option><option value="CV">Cabo Verde</option><option value="GB">Reino Unido</option><option value="US">Estados Unidos</option><option value="CH">Suíça</option></select></div>`:''}<div class="divider">método de identificação</div>${methodTabs()}${state.method==='PASSWORD'?`<div class="field"><label class="label">Palavra-passe</label><input id="regPassword" type="password" class="input" minlength="8" placeholder="mínimo 8 caracteres"></div>`:identityPanel('register')}<label class="check"><input id="terms" type="checkbox"> <span>Li e aceito os termos de utilização e a informação de privacidade.</span></label><div class="notice info">A versão final pode ligar estes métodos aos respetivos serviços oficiais. Este ficheiro é uma demonstração local.</div>${state.method==='PASSWORD'?`<button class="btn full" onclick="passwordRegister()">Criar conta</button>`:''}</div>`}
function pickBank(b){state.bank=b;render()}
function demoLogin(role){const u=db.users.find(x=>x.role===role&&x.id!=='cli2');if(u)setUser(u.id)}
function passwordLogin(){const email=(document.getElementById('loginEmail')?.value||'').trim().toLowerCase(),pass=document.getElementById('loginPassword')?.value||'';const u=db.users.find(x=>x.email===email&&x.password===pass&&x.role===state.loginRole);if(!u){toast('E-mail, palavra-passe ou perfil incorretos.');return}setUser(u.id);toast('Sessão iniciada.')}
function identityLogin(method,context){if(context==='register'){const name=(document.getElementById('regName')?.value||'').trim(),email=(document.getElementById('regEmail')?.value||'').trim().toLowerCase(),terms=document.getElementById('terms')?.checked;if(!name||!email){toast('Preencha nome e e-mail.');return}if(!terms){toast('Aceite os termos para continuar.');return}if(db.users.some(x=>x.email===email)){toast('Já existe uma conta com este e-mail.');return}const role=state.registerRole,companyId=role==='CLIENTE'?(db.users.find(x=>x.role==='EMPRESA')?.id||'emp1'):undefined;const u={id:uid('u'),role,name,email,password:'',auth:method,identifier:method==='BANK'?state.bank:(method==='NISS'?'NISS verificado':'CMD verificado'),country:document.getElementById('regCountry')?.value||'PT',companyId};db.users.push(u);save();setUser(u.id);toast('Conta criada com sucesso.')}else{const u=method==='CMD'?db.users.find(x=>x.role===state.loginRole&&x.auth==='CMD'):method==='NISS'?db.users.find(x=>x.role===state.loginRole&&x.auth==='NISS'):db.users.find(x=>x.role===state.loginRole&&x.auth==='BANCO');if(!u){toast('Não existe uma conta demo para este método neste perfil. Use uma conta demo ou o registo.');return}setUser(u.id);toast(`Autenticação ${method} simulada com sucesso.`)}}
function passwordRegister(){const name=(document.getElementById('regName')?.value||'').trim(),email=(document.getElementById('regEmail')?.value||'').trim().toLowerCase(),pass=document.getElementById('regPassword')?.value||'',terms=document.getElementById('terms')?.checked;if(!name||!email||pass.length<8){toast('Preencha os campos e use uma palavra-passe com pelo menos 8 caracteres.');return}if(!terms){toast('Aceite os termos para continuar.');return}if(db.users.some(x=>x.email===email)){toast('Já existe uma conta com este e-mail.');return}const role=state.registerRole,companyId=role==='CLIENTE'?(db.users.find(x=>x.role==='EMPRESA')?.id||'emp1'):undefined;const u={id:uid('u'),role,name,email,password:pass,auth:'PASSWORD',identifier:'',country:document.getElementById('regCountry')?.value||'PT',companyId};db.users.push(u);save();setUser(u.id);toast('Conta criada com sucesso.')}
function companyCharges(u){return db.charges.filter(c=>c.companyId===u.id)}
function dashboard(){const u=currentUser(),cs=companyCharges(u),clients=db.users.filter(x=>x.role==='CLIENTE'&&x.companyId===u.id),paid=cs.filter(c=>c.status==='PAGO').reduce((a,c)=>a+c.value,0),pending=cs.filter(c=>c.status!=='PAGO').reduce((a,c)=>a+c.value,0),overdue=cs.filter(c=>c.status==='EM_ATRASO').reduce((a,c)=>a+c.value,0),open=db.complaints.filter(r=>r.companyId===u.id&&r.status!=='RESOLVIDA').length;return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Área da empresa</div><h1>Dashboard</h1><p>Olá, ${esc(u.name)}. Aqui está o estado atual das suas cobranças.</p></div><div class="actions"><button class="btn" onclick="go('charges')">Nova cobrança</button><button class="btn secondary" onclick="go('clients')">Gerir clientes</button></div></div><div class="grid four stats"><div class="card stat"><div><div class="stat-label">Cobranças</div><div class="stat-value">${cs.length}</div></div><div class="stat-icon">🧾</div></div><div class="card stat"><div><div class="stat-label">Valor pago</div><div class="stat-value">${money(paid)}</div></div><div class="stat-icon">✅</div></div><div class="card stat"><div><div class="stat-label">Por receber</div><div class="stat-value">${money(pending)}</div></div><div class="stat-icon">🕒</div></div><div class="card stat"><div><div class="stat-label">Em atraso</div><div class="stat-value">${money(overdue)}</div></div><div class="stat-icon">⚠️</div></div></div><div class="grid two" style="margin-top:20px"><div class="card"><h2>Resumo operacional</h2><div class="mini-grid" style="margin-top:15px"><div class="mini"><div class="small muted">Clientes</div><strong>${clients.length}</strong></div><div class="mini"><div class="small muted">Reclamações abertas</div><strong>${open}</strong></div><div class="mini"><div class="small muted">Pagas</div><strong>${cs.filter(c=>c.status==='PAGO').length}</strong></div></div><div style="margin-top:18px"><div class="small muted">Taxa de cobrança liquidada</div><div class="progress" style="margin-top:7px"><span style="width:${cs.length?Math.round(cs.filter(c=>c.status==='PAGO').length/cs.length*100):0}%"></span></div><div class="small muted" style="margin-top:6px">${cs.length?Math.round(cs.filter(c=>c.status==='PAGO').length/cs.length*100):0}% das cobranças pagas</div></div></div><div class="card"><h2>Regras de cobrança</h2><div class="stack" style="margin-top:14px"><div class="rule"><b>7 dias antes</b><span>Notificação + desconto de 3%.</span></div><div class="rule"><b>3 dias antes</b><span>Nova notificação.</span></div><div class="rule"><b>Último dia</b><span>Notificação com ligação para pagamento.</span></div><div class="rule"><b>Depois do prazo</b><span>Em atraso + multa automática.</span></div></div></div></div><div class="card" style="margin-top:20px"><div class="pagehead"><div><h2>Cobranças recentes</h2><p>As cobranças da sua empresa.</p></div><button class="btn secondary small" onclick="go('charges')">Ver todas</button></div>${chargeTable(cs.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8))}</div></div></section>`}
function chargeTable(cs){return `<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Cliente</th><th>Descrição</th><th>Valor</th><th>Prazo</th><th>Estado</th><th></th></tr></thead><tbody>${cs.length?cs.map(c=>{const cl=db.users.find(u=>u.id===c.clientId);return `<tr><td><strong>${esc(cl?.name||'—')}</strong></td><td>${esc(c.description)}</td><td>${money(c.value)}</td><td>${fmtDate(c.due)}</td><td>${badge(c.status)}</td><td><button class="btn secondary small" onclick="openCharge('${c.id}')">Abrir</button></td></tr>`}).join(''):`<tr><td colspan="6" class="muted">Ainda não existem cobranças.</td></tr>`}</tbody></table></div>`}
function charges(){const u=currentUser(),cs=companyCharges(u),clients=db.users.filter(x=>x.role==='CLIENTE'&&x.companyId===u.id);return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Empresa</div><h1>Cobranças</h1><p>Criar, notificar, acompanhar e marcar cobranças como pagas.</p></div></div><div class="grid two" style="margin-top:22px"><div class="card"><h2>Nova cobrança</h2><div class="form" style="margin-top:15px"><div class="field"><label class="label">Cliente</label><select id="newClient" class="select">${clients.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.email)}</option>`).join('')}</select></div><div class="field"><label class="label">Descrição</label><input id="newDesc" class="input" placeholder="Ex.: Serviço mensal"></div><div class="field"><label class="label">Valor (€)</label><input id="newValue" type="number" step="0.01" min="0.01" class="input" placeholder="120.00"></div><div class="field"><label class="label">Data limite</label><input id="newDue" type="date" class="input" value="${datePlus(7)}"></div><button class="btn full" onclick="createCharge()" ${clients.length?'':'disabled'}>Criar cobrança</button>${clients.length?'':'<div class="notice warn">Adicione primeiro um cliente.</div>'}</div></div><div class="card"><h2>Automação</h2><p class="small muted">A lógica abaixo está simulada neste protótipo e acompanha as regras do trabalho.</p><div class="stack" style="margin-top:14px"><div class="rule"><b>7 dias antes</b><span>3% de desconto + notificação.</span></div><div class="rule"><b>3 dias antes</b><span>Nova notificação.</span></div><div class="rule"><b>Último dia</b><span>Notificação com pagamento em destaque.</span></div><div class="rule"><b>Após o vencimento</b><span>Estado em atraso + multa.</span></div></div></div></div><div class="card" style="margin-top:20px"><div class="pagehead"><div><h2>Lista de cobranças</h2><p>${cs.length} cobrança(s).</p></div><input class="input" style="max-width:280px" placeholder="Pesquisar cliente ou cobrança..." oninput="filterCharges(this.value)"></div><div id="chargesTable">${chargeTableWithActions(cs)}</div></div></div></section>`}
function chargeTableWithActions(cs){return `<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Cliente</th><th>Descrição</th><th>Valor</th><th>Prazo</th><th>Estado</th><th>Ações</th></tr></thead><tbody>${cs.length?cs.map(c=>{const cl=db.users.find(u=>u.id===c.clientId);return `<tr data-charge-search="${esc((cl?.name||'')+' '+c.description)}"><td>${esc(cl?.name||'—')}</td><td>${esc(c.description)}</td><td>${money(c.value)}</td><td>${fmtDate(c.due)}</td><td>${badge(c.status)}</td><td><div class="actions">${c.status!=='PAGO'?`<button class="btn secondary small" onclick="markPaid('${c.id}')">Marcar pago</button>`:''}<button class="btn small" onclick="notifyCharge('${c.id}')">Notificar</button><button class="btn secondary small" onclick="openCharge('${c.id}')">Detalhes</button></div></td></tr>`}).join(''):`<tr><td colspan="6" class="muted">Ainda não existem cobranças.</td></tr>`}</tbody></table></div>`}
function filterCharges(q){const s=q.toLowerCase();document.querySelectorAll('[data-charge-search]').forEach(r=>r.style.display=r.dataset.chargeSearch.toLowerCase().includes(s)?'':'none')}
function createCharge(){const clientId=document.getElementById('newClient')?.value,description=(document.getElementById('newDesc')?.value||'').trim(),value=Number(document.getElementById('newValue')?.value),due=document.getElementById('newDue')?.value;if(!clientId||!description||!value||!due){toast('Preencha todos os campos.');return}db.charges.unshift({id:uid('c'),description,value,due,status:'PENDENTE',companyId:currentUser().id,clientId,discount:3,fine:0,created:new Date().toISOString().slice(0,10)});db.notifications.unshift({id:uid('n'),clientId,text:`Nova cobrança: ${description} — ${money(value)} — vence em ${fmtDate(due)}.`,read:false,date:new Date().toISOString()});save();toast('Cobrança criada e cliente notificado.');render()}
function markPaid(id){const c=db.charges.find(x=>x.id===id);if(!c)return;c.status='PAGO';db.payments.push({id:uid('p'),chargeId:id,clientId:c.clientId,value:c.value,currency:'EUR',method:'Registo pela empresa',date:new Date().toISOString()});db.notifications.unshift({id:uid('n'),clientId:c.clientId,text:`Pagamento confirmado: ${c.description}. A cobrança foi marcada como paga.`,read:false,date:new Date().toISOString()});save();toast('Pagamento registado.');render()}
function notifyCharge(id){const c=db.charges.find(x=>x.id===id);if(!c)return;db.notifications.unshift({id:uid('n'),clientId:c.clientId,text:`Lembrete de cobrança: ${c.description} — ${money(c.value)} — prazo ${fmtDate(c.due)}.`,read:false,date:new Date().toISOString()});save();toast('Notificação enviada ao cliente.');render()}
function clients(){const u=currentUser(),cs=db.users.filter(x=>x.role==='CLIENTE'&&x.companyId===u.id);return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Empresa</div><h1>Clientes</h1><p>Clientes associados à sua empresa e respetivo histórico.</p></div></div><div class="grid two" style="margin-top:22px"><div class="card"><h2>Adicionar cliente</h2><div class="form" style="margin-top:15px"><div class="field"><label class="label">Nome</label><input id="clName" class="input" placeholder="Nome do cliente"></div><div class="field"><label class="label">E-mail</label><input id="clEmail" type="email" class="input" placeholder="cliente@exemplo.pt"></div><div class="field"><label class="label">País</label><select id="clCountry" class="select"><option value="PT">Portugal</option><option value="BR">Brasil</option><option value="AO">Angola</option><option value="MZ">Moçambique</option><option value="CV">Cabo Verde</option><option value="GB">Reino Unido</option><option value="US">Estados Unidos</option><option value="CH">Suíça</option></select></div><button class="btn full" onclick="createClient()">Adicionar cliente</button><div class="notice info">O convite pode, numa versão real, encaminhar o cliente para CMD, banco ou outro fluxo autorizado.</div></div></div><div class="card"><h2>Lista de clientes</h2><div class="list" style="margin-top:15px">${cs.length?cs.map(c=>{const charges=db.charges.filter(x=>x.clientId===c.id),paid=charges.filter(x=>x.status==='PAGO').length,open=db.complaints.filter(x=>x.clientId===c.id&&x.status!=='RESOLVIDA').length;return `<div class="list-item"><div><strong>${esc(c.name)}</strong><div class="small muted">${esc(c.email)} · ${c.country||'PT'} · ${currencyForCountry(c.country||'PT')}</div></div><div class="actions"><span class="small muted">${charges.length} cobrança(s) · ${paid} paga(s) · ${open} reclamação(ões)</span><button class="btn secondary small" onclick="openClient('${c.id}')">Abrir</button></div></div>`}).join(''):'<div class="empty">Ainda não existem clientes.</div>'}</div></div></div></div></section>`}
function createClient(){const name=(document.getElementById('clName')?.value||'').trim(),email=(document.getElementById('clEmail')?.value||'').trim().toLowerCase(),country=document.getElementById('clCountry')?.value||'PT';if(!name||!email){toast('Preencha nome e e-mail.');return}if(db.users.some(x=>x.email===email)){toast('Já existe uma conta com este e-mail.');return}const id=uid('u');db.users.push({id,role:'CLIENTE',name,email,password:'cliente123',auth:'CONVITE',identifier:'',country,companyId:currentUser().id});db.notifications.unshift({id:uid('n'),clientId:id,text:`Foi criada uma conta de cliente para si. A empresa ${currentUser().name} poderá associar cobranças à sua área.`,read:false,date:new Date().toISOString()});save();toast('Cliente adicionado. Palavra-passe demo: cliente123');render()}
function complaints(){const u=currentUser(),rs=db.complaints.filter(r=>r.companyId===u.id);return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Empresa</div><h1>Reclamações</h1><p>Acompanhe pedidos dos clientes e responda diretamente.</p></div></div><div class="stack" style="margin-top:22px">${rs.length?rs.map(r=>{const c=db.users.find(x=>x.id===r.clientId),charge=db.charges.find(x=>x.id===r.chargeId);return `<div class="card"><div class="pagehead"><div><strong>${esc(c?.name||'Cliente')}</strong><div class="small muted">${charge?esc(charge.description):'Sem cobrança associada'} · ${new Date(r.date).toLocaleDateString('pt-PT')}</div></div><div>${complaintBadge(r.status)}</div></div><p style="font-size:14px">${esc(r.message)}</p>${r.response?`<div class="notice info"><b>Resposta da empresa:</b> ${esc(r.response)}</div>`:''}${r.status!=='RESOLVIDA'?`<div class="form" style="margin-top:12px"><textarea id="resp-${r.id}" class="textarea" rows="2" placeholder="Escreva uma resposta..."></textarea><div class="actions"><button class="btn secondary small" onclick="respondComplaint('${r.id}','EM_ANALISE')">Em análise</button><button class="btn small" onclick="respondComplaint('${r.id}','RESOLVIDA')">Resolver</button></div></div>`:''}</div>`}).join(''):'<div class="card empty">Ainda não existem reclamações.</div>'}</div></div></section>`}
function respondComplaint(id,status){const r=db.complaints.find(x=>x.id===id);if(!r)return;const response=(document.getElementById('resp-'+id)?.value||'').trim();if(response)r.response=response;r.status=status;db.notifications.unshift({id:uid('n'),clientId:r.clientId,text:`A empresa atualizou a sua reclamação: ${status==='RESOLVIDA'?'resolvida':'em análise'}.`,read:false,date:new Date().toISOString()});save();toast('Reclamação atualizada.');render()}
function rules(){return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Configuração</div><h1>Regras de cobrança</h1><p>Exemplo das regras definidas no trabalho.</p></div></div><div class="grid two" style="margin-top:22px"><div class="card"><h2>Antes do vencimento</h2><div class="stack" style="margin-top:15px"><div class="rule"><b>7 dias antes</b><span>Aplicar desconto de 3% e enviar notificação.</span></div><div class="rule"><b>3 dias antes</b><span>Enviar nova notificação.</span></div><div class="rule"><b>Último dia</b><span>Enviar aviso final com ligação/botão de pagamento.</span></div></div></div><div class="card"><h2>Depois do vencimento</h2><div class="stack" style="margin-top:15px"><div class="rule"><b>1.º nível</b><span>Marcar cobrança como em atraso e avisar o cliente.</span></div><div class="rule"><b>Multa</b><span>Aplicar multa automática definida pela empresa.</span></div><div class="rule"><b>Negociação</b><span>Permitir plano de pagamento e facilitar clientes com dificuldades.</span></div></div></div></div><div class="card" style="margin-top:18px"><h2>Privacidade e segurança</h2><p class="small muted">O produto real deverá aplicar consentimento, proteção de dados, controlo de acesso e tratamento seguro dos dados de autenticação. Os métodos CMD, banco e Segurança Social não devem ter credenciais sensíveis guardadas nesta aplicação.</p></div></div></section>`}
function clientArea(){const u=currentUser(),cs=db.charges.filter(c=>c.clientId===u.id),ns=db.notifications.filter(n=>n.clientId===u.id),rs=db.complaints.filter(r=>r.clientId===u.id),unread=ns.filter(n=>!n.read).length,total=cs.filter(c=>c.status!=='PAGO').reduce((a,c)=>a+clientTotal(c),0),paid=cs.filter(c=>c.status==='PAGO').reduce((a,c)=>a+c.value,0);return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Área do cliente</div><h1>Olá, ${esc(u.name)}</h1><p>Consulte cobranças, pague, negoceie prestações e envie reclamações.</p></div><div class="notice info">Identidade: ${esc(u.auth||'Conta demo')}</div></div><div class="grid three stats"><div class="card stat"><div><div class="stat-label">Por pagar</div><div class="stat-value">${money(total,currencyForCountry(u.country))}</div></div><div class="stat-icon">💳</div></div><div class="card stat"><div><div class="stat-label">Pagas</div><div class="stat-value">${money(paid)}</div></div><div class="stat-icon">✅</div></div><div class="card stat"><div><div class="stat-label">Notificações</div><div class="stat-value">${unread}</div></div><div class="stat-icon">🔔</div></div></div><div class="card" style="margin-top:20px"><div class="pagehead"><div><h2>Notificações</h2><p>${unread?`${unread} por ler.`:'Tudo lido.'}</p></div>${unread?'<button class="btn secondary small" onclick="readNotifications()">Marcar todas como lidas</button>':''}</div><div class="stack" style="margin-top:14px">${ns.length?ns.slice(0,8).map(n=>`<div class="notice ${n.read?'':'info'}"><b>${n.read?'':'Nova · '}</b>${esc(n.text)} <span class="small muted">${new Date(n.date).toLocaleDateString('pt-PT')}</span></div>`).join(''):'<div class="empty">Sem notificações.</div>'}</div></div><div class="grid two" style="margin-top:20px">${cs.length?cs.map(renderClientCharge).join(''):'<div class="card empty">Ainda não existem cobranças associadas à sua conta.</div>'}</div><div class="card" style="margin-top:20px"><div class="pagehead"><div><h2>Reclamações e suporte</h2><p>Associe a reclamação a uma cobrança ou envie uma mensagem geral.</p></div></div><div class="form" style="margin-top:15px"><select id="complaintCharge" class="select"><option value="">Sem cobrança específica</option>${cs.map(c=>`<option value="${c.id}">${esc(c.description)} — ${money(c.value)}</option>`).join('')}</select><textarea id="complaintText" class="textarea" rows="3" placeholder="Descreva o problema..."></textarea><button class="btn" onclick="sendComplaint()">Enviar reclamação</button></div><div class="stack" style="margin-top:15px">${rs.length?rs.map(r=>`<div class="list-item"><div><div class="small muted">${new Date(r.date).toLocaleDateString('pt-PT')}</div><p style="margin:4px 0;font-size:13px">${esc(r.message)}</p>${r.response?`<div class="notice info"><b>Resposta:</b> ${esc(r.response)}</div>`:''}</div>${complaintBadge(r.status)}</div>`).join(''):'<div class="empty">Sem reclamações.</div>'}</div></div></div></section>`}
function clientTotal(c){let v=c.value;if(c.status==='EM_ATRASO'&&c.fine)v+=v*c.fine/100;return c.discount&&c.status!=='EM_ATRASO'?v-v*c.discount/100:v}
function renderClientCharge(c){const u=currentUser(),cur=currencyForCountry(u.country||'PT'),v=clientTotal(c),plan=db.plans.find(p=>p.chargeId===c.id);return `<div class="card charge-card"><div class="charge-top"><div><h2 style="font-size:17px">${esc(c.description)}</h2><div class="subline">Prazo: ${fmtDate(c.due)}</div></div>${badge(c.status)}</div><div><div class="amount">${money(converted(v,u.country),cur)}</div>${cur!=='EUR'?`<div class="subline">Equivalente: ${money(v)} · taxa de referência 1 EUR = ${FX[cur]} ${cur}</div>`:''}</div>${c.discount>0&&c.status!=='EM_ATRASO'?`<div class="notice success">Desconto de 3% disponível para pagamento antecipado.</div>`:''}${c.fine>0&&c.status==='EM_ATRASO'?`<div class="notice danger">Multa de ${c.fine}% aplicada por atraso. Total atual: ${money(v,cur)}.</div>`:''}${plan?`<div class="notice purple"><b>Plano de ${plan.n} prestações</b><div class="stack" style="margin-top:9px">${plan.installments.map(p=>`<div class="list-item"><span>Prestação ${p.n} · ${money(converted(p.value,u.country),cur)} · ${fmtDate(p.due)}</span>${p.paid?'<span class="badge paid">Paga</span>':`<button class="btn secondary small" onclick="payInstallment('${p.id}')">Pagar</button>`}</div>`).join('')}</div></div>`:''}${c.status!=='PAGO'?`<div class="stack"><div class="split"><select id="method-${c.id}" class="select"><option>MB Way</option><option>Cartão</option><option>Transferência bancária</option><option>Referência Multibanco</option><option>Pagamento com um clique</option></select><button class="btn" onclick="openPayment('${c.id}')">Pagar agora</button></div><div class="split"><select id="plan-${c.id}" class="select"><option value="2">2 prestações</option><option value="3">3 prestações</option><option value="6">6 prestações</option></select><button class="btn secondary" onclick="negotiate('${c.id}')">Negociar</button></div></div>`:`<div class="notice success">Cobrança paga. Consulte o histórico para ver a data e o método.</div>`}</div>`}
function openPayment(id){const c=db.charges.find(x=>x.id===id),u=currentUser();if(!c||!u)return;const cur=currencyForCountry(u.country||'PT'),base=clientTotal(c);document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">Pagamento</div><h2>${esc(c.description)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="stack" style="margin-top:18px"><div class="notice info">Valor final antes da confirmação: <b>${money(converted(base,u.country),cur)}</b>${cur!=='EUR'?` · equivalente a ${money(base)}`:''}</div><div class="field"><label class="label">Moeda de pagamento</label><select id="payCurrency" class="select" onchange="updatePaymentPreview(${base},'${u.country}')"><option value="${cur}">${cur}</option><option value="EUR">EUR</option><option value="USD">USD</option><option value="GBP">GBP</option><option value="BRL">BRL</option><option value="AOA">AOA</option><option value="MZN">MZN</option><option value="CVE">CVE</option><option value="CHF">CHF</option></select></div><div id="paymentPreview" class="notice success">Total: <b>${money(converted(base,u.country),cur)}</b></div><div class="field"><label class="label">Método de pagamento</label><select id="payMethod" class="select"><option>MB Way</option><option>Cartão</option><option>Transferência bancária</option><option>Referência Multibanco</option><option>Pagamento com um clique</option></select></div><div class="notice warn">A conversão apresentada é demonstrativa. Numa integração real, a taxa deve ser obtida no momento da confirmação.</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmPayment('${id}')">Confirmar pagamento</button></div></div></div></div>`}
function updatePaymentPreview(base,country){const c=document.getElementById('payCurrency').value;const rate=FX[c]||1;document.getElementById('paymentPreview').innerHTML=`Total: <b>${money(base*rate,c)}</b> · taxa de referência 1 EUR = ${rate} ${c}`}
function confirmPayment(id){const c=db.charges.find(x=>x.id===id),method=document.getElementById('payMethod')?.value||'Pagamento';if(!c)return;c.status='PAGO';db.payments.push({id:uid('p'),chargeId:id,clientId:c.clientId,value:clientTotal(c),currency:document.getElementById('payCurrency')?.value||'EUR',method,date:new Date().toISOString()});db.notifications.unshift({id:uid('n'),clientId:c.clientId,text:`Pagamento confirmado para “${c.description}” através de ${method}.`,read:false,date:new Date().toISOString()});save();closeModal();toast('Pagamento confirmado. A cobrança está paga.');render()}
function negotiate(id){const c=db.charges.find(x=>x.id===id),n=Math.min(6,Math.max(2,Number(document.getElementById('plan-'+id)?.value)||3));if(!c)return;const base=Math.floor((c.value/n)*100)/100,inst=[];for(let i=0;i<n;i++){let value=i===n-1?Math.round((c.value-base*(n-1))*100)/100:base;const d=new Date(c.due+'T12:00:00');d.setMonth(d.getMonth()+i+1);inst.push({id:uid('i'),n:i+1,value,due:d.toISOString().slice(0,10),paid:false})}c.status='NEGOCIACAO';const old=db.plans.find(p=>p.chargeId===id);if(old){old.n=n;old.installments=inst}else db.plans.push({id:uid('pl'),chargeId:id,clientId:c.clientId,n,installments:inst});db.notifications.unshift({id:uid('n'),clientId:c.clientId,text:`Plano de pagamento criado para “${c.description}”: ${n} prestações.`,read:false,date:new Date().toISOString()});save();toast(`Plano de ${n} prestações criado.`);render()}
function payInstallment(pid){for(const plan of db.plans){const p=plan.installments.find(x=>x.id===pid);if(p&&!p.paid){p.paid=true;const c=db.charges.find(x=>x.id===plan.chargeId);db.payments.push({id:uid('p'),chargeId:c.id,clientId:c.clientId,value:p.value,currency:'EUR',method:'Prestação',date:new Date().toISOString()});if(plan.installments.every(x=>x.paid))c.status='PAGO';db.notifications.unshift({id:uid('n'),clientId:c.clientId,text:`Prestação ${p.n} paga para “${c.description}”.`,read:false,date:new Date().toISOString()});save();toast('Prestação paga.');render();return}}}
function sendComplaint(){const u=currentUser(),text=(document.getElementById('complaintText')?.value||'').trim(),chargeId=document.getElementById('complaintCharge')?.value||'';if(!text){toast('Escreva a reclamação.');return}const companyId=u.companyId||'emp1',r={id:uid('r'),clientId:u.id,companyId,chargeId,message:text,status:'PENDENTE',response:'',date:new Date().toISOString()};db.complaints.unshift(r);db.notifications.unshift({id:uid('n'),clientId:u.id,text:'A sua reclamação foi registada e enviada à empresa.',read:false,date:new Date().toISOString()});save();toast('Reclamação enviada.');render()}
function readNotifications(){const u=currentUser();db.notifications.filter(n=>n.clientId===u.id).forEach(n=>n.read=true);save();render();toast('Notificações marcadas como lidas.')}
function historyPage(){const u=currentUser(),ps=db.payments.filter(p=>p.clientId===u.id).sort((a,b)=>b.date.localeCompare(a.date)),cs=db.charges.filter(c=>c.clientId===u.id);return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Cliente</div><h1>Histórico</h1><p>Pagamentos, cobranças e estado da conta.</p></div></div><div class="card" style="margin-top:22px"><h2>Pagamentos</h2><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Data</th><th>Cobrança</th><th>Valor</th><th>Método</th></tr></thead><tbody>${ps.length?ps.map(p=>{const c=db.charges.find(x=>x.id===p.chargeId);return `<tr><td>${new Date(p.date).toLocaleString('pt-PT')}</td><td>${esc(c?.description||'—')}</td><td>${money(p.value,p.currency||'EUR')}</td><td>${esc(p.method)}</td></tr>`}).join(''):`<tr><td colspan="4" class="muted">Ainda não existem pagamentos.</td></tr>`}</tbody></table></div></div><div class="card" style="margin-top:18px"><h2>Todas as cobranças</h2>${chargeTableClient(cs,u)}</div></div></section>`}
function chargeTableClient(cs,u){return `<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Descrição</th><th>Valor</th><th>Prazo</th><th>Estado</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.description)}</td><td>${money(converted(clientTotal(c),u.country),currencyForCountry(u.country))}</td><td>${fmtDate(c.due)}</td><td>${badge(c.status)}</td></tr>`).join('')}</tbody></table></div>`}
function profile(){const u=currentUser();return `<section class="page"><div class="container"><div class="pagehead"><div><div class="eyebrow">Conta</div><h1>Perfil</h1><p>Dados da conta atualmente autenticada.</p></div></div><div class="card" style="max-width:700px;margin-top:22px"><div class="grid two"><div><div class="small muted">Nome</div><strong>${esc(u.name)}</strong></div><div><div class="small muted">Perfil</div><strong>${u.role==='EMPRESA'?'Empresa':'Cliente'}</strong></div><div><div class="small muted">E-mail</div><strong>${esc(u.email)}</strong></div><div><div class="small muted">Método de autenticação</div><strong>${esc(u.auth||'E-mail')}</strong></div>${u.role==='CLIENTE'?`<div><div class="small muted">País / moeda</div><strong>${esc(u.country||'PT')} / ${currencyForCountry(u.country||'PT')}</strong></div><div><div class="small muted">Empresa</div><strong>${esc(db.users.find(x=>x.id===u.companyId)?.name||'—')}</strong></div>`:''}</div><div class="notice info" style="margin-top:18px">Os dados desta demonstração ficam no armazenamento local do navegador. Para produção será necessário backend, sessão segura e integrações oficiais de identidade/pagamento.</div><div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="resetDemo()">Repor dados demo</button><button class="btn" onclick="logout()">Terminar sessão</button></div></div></div></section>`}
function openCharge(id){const c=db.charges.find(x=>x.id===id);if(!c)return;const cl=db.users.find(x=>x.id===c.clientId),plan=db.plans.find(p=>p.chargeId===id),payments=db.payments.filter(p=>p.chargeId===id);document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">Detalhes da cobrança</div><h2>${esc(c.description)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="stack" style="margin-top:18px"><div class="list-item"><span>Cliente</span><strong>${esc(cl?.name||'—')}</strong></div><div class="list-item"><span>Valor</span><strong>${money(c.value)}</strong></div><div class="list-item"><span>Prazo</span><strong>${fmtDate(c.due)}</strong></div><div class="list-item"><span>Estado</span>${badge(c.status)}</div>${c.discount?`<div class="notice success">Desconto antecipado: ${c.discount}%</div>`:''}${c.fine?`<div class="notice danger">Multa: ${c.fine}%</div>`:''}${plan?`<div class="notice purple"><b>Plano: ${plan.n} prestações</b><br>${plan.installments.map(p=>`Prestação ${p.n}: ${money(p.value)} · ${fmtDate(p.due)} · ${p.paid?'paga':'pendente'}`).join('<br>')}</div>`:''}<div class="card" style="padding:15px;background:#fafafa;box-shadow:none"><b>Pagamentos registados</b><div class="stack" style="margin-top:9px">${payments.length?payments.map(p=>`<div class="small">${new Date(p.date).toLocaleString('pt-PT')} · ${money(p.value,p.currency)} · ${esc(p.method)}</div>`).join(''):'<span class="small muted">Nenhum pagamento.</span>'}</div></div><div class="actions">${c.status!=='PAGO'?`<button class="btn" onclick="markPaid('${c.id}');closeModal()">Marcar como paga</button>`:''}<button class="btn secondary" onclick="notifyCharge('${c.id}');closeModal()">Enviar notificação</button><button class="btn secondary" onclick="closeModal()">Fechar</button></div></div></div></div>`}
function openClient(id){const c=db.users.find(x=>x.id===id);if(!c)return;const cs=db.charges.filter(x=>x.clientId===id),ps=db.payments.filter(x=>x.clientId===id),rs=db.complaints.filter(x=>x.clientId===id);document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">Perfil do cliente</div><h2>${esc(c.name)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="grid two" style="margin-top:18px"><div><div class="small muted">E-mail</div><strong>${esc(c.email)}</strong></div><div><div class="small muted">País / moeda</div><strong>${c.country||'PT'} / ${currencyForCountry(c.country||'PT')}</strong></div><div><div class="small muted">Cobranças</div><strong>${cs.length}</strong></div><div><div class="small muted">Pagamentos</div><strong>${ps.length}</strong></div></div><div class="stack" style="margin-top:18px"><h3>Cobranças</h3>${cs.map(x=>`<div class="list-item"><span>${esc(x.description)}</span><span>${money(x.value)} · ${badge(x.status)}</span></div>`).join('')||'<div class="empty">Sem cobranças.</div>'}<h3 style="margin-top:8px">Reclamações</h3>${rs.map(r=>`<div class="list-item"><span>${esc(r.message)}</span>${complaintBadge(r.status)}</div>`).join('')||'<div class="empty">Sem reclamações.</div>'}</div><div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="closeModal()">Fechar</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
render();
</script>
</body>
</html>
